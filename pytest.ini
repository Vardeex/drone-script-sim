[pytest]
testpaths = tests
pythonpath = .
addopts = -q --color=no
# Po 60 s wisi test -> zrzut stosów wszystkich wątków do logu (faulthandler).
# Dzięki temu w CI widać, GDZIE wisi (np. w której blokadzie), zamiast czekać
# na timeout joba. Wartość dobrana do najdłuższego pojedynczego testu (~10 s
# na wolniejszej maszynie); cały zestaw ma osobne limity w workflow.
faulthandler_timeout = 60
markers =
    browser: testy wymagające przeglądarki (Playwright + Chromium); w CI osobny job
    slow: testy losowe w pełnym wariancie (setki przypadków); CI tylko przy workflow_dispatch
    perf: pomiar wydajności (profil „ziemniak”, ~1 min); tylko ręcznie / workflow_dispatch
    desktop: testy wymagające pulpitu Windows (ikona w zasobniku, okno, pętla komunikatów); CI je pomija (-m "not desktop")
filterwarnings =
    ignore::DeprecationWarning
