[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dronemoves"
version = "0.3.0"
description = "Płynne manewry (forward, turn, arc, circle, slalom, spirala...) dla dronów sterowanych z Pythona"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vardeex" }]
keywords = ["drone", "tello", "djitellopy", "uav", "flight", "maneuvers", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
# backend dla DJI Tello (prawdziwy dron); symulator podstawia własny mock
tello = ["djitellopy>=2.4"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Vardeex/drone-script-sim"
Documentation = "https://github.com/Vardeex/drone-script-sim/tree/main/lib/dronemoves#readme"
Changelog = "https://github.com/Vardeex/drone-script-sim/blob/main/lib/dronemoves/CHANGELOG.md"

[tool.setuptools]
packages = ["dronemoves", "dronemoves.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
