name: Testy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Anuluj poprzedni przebieg dla tego samego brancha/PR (oszczędza minuty)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Konsola runnera Windows używa cp1252 - polskie znaki w nazwach testów
# i komunikatach wywalają się wtedy z UnicodeEncodeError. UTF-8 dla całości.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ---------------------------------------------------------------- testy główne
  tests:
    name: Testy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # twardy limit: normalnie ~1 min; wisi = szybciej widać w podsumowaniu
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Zależności aplikacji
        run: python -m pip install --upgrade pip -r requirements.txt pyflakes

      - name: pyflakes
        run: python -m pyflakes app tests lib/dronemoves

      - name: Testy aplikacji (bez przeglądarki, bez testów losowych)
        # -v + --durations: w logu widać, który test trwa (bez tego CI milczy
        # do końca). faulthandler_timeout z pytest.ini robi zrzut stosów po 60 s.
        run: python -m pytest -p no:cacheprovider -v --durations=20 -m "not browser and not slow"

      - name: Testy biblioteki dronemoves
        working-directory: lib/dronemoves
        run: python -m pytest -p no:cacheprovider

  # ------------------------------------- pełne testy losowe (tylko ręcznie)
  # Setki losowych lotów (200 sekwencji manewrów + 100 tras planera) trwają
  # kilka minut - uruchamiane wyłącznie z przycisku „Run workflow”.
  random:
    name: Testy losowe — pełny wariant (marker slow)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # pełny wariant: ~4 min lokalnie, 60 min to limit bezpieczeństwa
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Zależności aplikacji
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Testy losowe (slow)
        run: python -m pytest -p no:cacheprovider -v --durations=20 -m slow --tb=short

  # ------------------------------------------------------- przeglądarka (Playwright)
  browser:
    name: Testy w przeglądarce (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Zależności aplikacji + Playwright
        run: python -m pip install --upgrade pip -r requirements.txt playwright

      - name: Chromium
        run: python -m playwright install --with-deps chromium

      - name: Testy przeglądarkowe
        run: python -m pytest -p no:cacheprovider -v --durations=20 -m browser

  # ------------------------------------------------------------- paczka biblioteki
  package:
    name: Paczka dronemoves (build + twine check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: build + twine
        run: python -m pip install --upgrade pip build twine

      - name: Zbuduj paczkę i sprawdź metadane
        working-directory: lib/dronemoves
        run: |
          python -m build
          python -m twine check --strict dist/*
